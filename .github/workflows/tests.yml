name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  dashboard-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional dashboard dependencies
        run: python -m pip install -r requirements-dashboard.txt
      - name: Run dashboard API integration tests
        run: python -m unittest discover -s tests -p "test_*api.py" -v

  dashboard-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run typecheck
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  # Real Docker sandbox execution. Unlike the unit tests, this job runs actual
  # containers through the production code path instead of mocking the Docker
  # CLI. It fails if the Docker daemon is expected but unavailable.
  docker-integration:
    runs-on: ubuntu-latest
    needs: unittest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Docker daemon is available
        run: docker info
      - name: Pull the test image explicitly
        # The engine never pulls images or installs dependencies; CI does it here.
        run: docker pull python:3.12-slim
      - name: Run Docker integration tests
        env:
          VCQA_DOCKER_INTEGRATION: "1"
          VCQA_INTEGRATION_IMAGE: python:3.12-slim
        run: python -m unittest discover -s tests -p "test_docker_integration.py" -v
