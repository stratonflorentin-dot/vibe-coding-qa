<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 360" width="460" height="360" role="img" aria-label="Two friendly plumber-coder pet mascots, one red and one green">
  <title>Pipe Pals — original plumber-coder pets</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#2a2550"/>
      <stop offset="60%" stop-color="#1c1836"/>
      <stop offset="100%" stop-color="#141026"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd9b0"/>
      <stop offset="100%" stop-color="#f2b483"/>
    </linearGradient>
    <linearGradient id="capR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5a52"/>
      <stop offset="100%" stop-color="#d12f2a"/>
    </linearGradient>
    <linearGradient id="capG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fd27a"/>
      <stop offset="100%" stop-color="#1f9e52"/>
    </linearGradient>
    <linearGradient id="deni" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f73d6"/>
      <stop offset="100%" stop-color="#2f4aa8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      @keyframes bobA { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-10px); } }
      @keyframes bobB { 0%,100%{ transform: translateY(-4px); } 50%{ transform: translateY(-16px); } }
      @keyframes blink { 0%,92%,100%{ transform: scaleY(1); } 96%{ transform: scaleY(0.08); } }
      @keyframes twinkle { 0%,100%{ opacity:.25; transform: scale(.7);} 50%{ opacity:1; transform: scale(1);} }
      @keyframes shadowA { 0%,100%{ transform: scale(1); opacity:.5;} 50%{ transform: scale(.86); opacity:.32;} }
      .petA { animation: bobA 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .petB { animation: bobB 2.6s ease-in-out infinite .5s; transform-box: fill-box; transform-origin: center; }
      .eye  { animation: blink 4.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .eyeB { animation: blink 4.4s ease-in-out infinite 2.2s; transform-box: fill-box; transform-origin: center; }
      .shA  { animation: shadowA 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .shB  { animation: shadowA 2.6s ease-in-out infinite .5s; transform-box: fill-box; transform-origin: center; }
      .spark{ animation: twinkle 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: reduce){ .petA,.petB,.eye,.eyeB,.shA,.shB,.spark{ animation: none; } }
    </style>
  </defs>

  <rect width="460" height="360" rx="28" fill="url(#bg)"/>

  <!-- ground shadows -->
  <ellipse class="shA" cx="150" cy="320" rx="62" ry="15" fill="#000" opacity=".5"/>
  <ellipse class="shB" cx="312" cy="322" rx="60" ry="14" fill="#000" opacity=".5"/>

  <!-- ===================== RED BRO ("Pip") ===================== -->
  <g class="petA">
    <!-- body -->
    <g filter="url(#soft)">
      <path d="M112 300 Q150 316 188 300 L182 236 Q150 224 118 236 Z" fill="url(#deni)"/>
      <path d="M112 300 Q150 316 188 300 L186 286 Q150 300 114 286 Z" fill="#24307a"/>
      <!-- red shirt shoulders/arms -->
      <path d="M118 238 Q150 220 182 238 L188 258 Q150 244 112 258 Z" fill="url(#capR)"/>
      <circle cx="108" cy="262" r="16" fill="url(#capR)"/>
      <circle cx="192" cy="262" r="16" fill="url(#capR)"/>
      <!-- white gloves -->
      <circle cx="101" cy="278" r="12" fill="#fdfdfd"/>
      <circle cx="199" cy="278" r="12" fill="#fdfdfd"/>
      <!-- overall straps + buttons -->
      <rect x="131" y="236" width="9" height="40" rx="4" fill="url(#deni)"/>
      <rect x="160" y="236" width="9" height="40" rx="4" fill="url(#deni)"/>
      <circle cx="135" cy="248" r="4.4" fill="#ffd34e"/>
      <circle cx="164" cy="248" r="4.4" fill="#ffd34e"/>
      <!-- shoes -->
      <ellipse cx="133" cy="306" rx="18" ry="11" fill="#6a3b1c"/>
      <ellipse cx="167" cy="306" rx="18" ry="11" fill="#6a3b1c"/>
    </g>

    <!-- head -->
    <g filter="url(#soft)">
      <circle cx="150" cy="150" r="58" fill="url(#skin)"/>
      <!-- ears -->
      <circle cx="96" cy="152" r="12" fill="url(#skin)"/>
      <circle cx="204" cy="152" r="12" fill="url(#skin)"/>
      <!-- sideburns / hair -->
      <path d="M100 150 q-4 36 18 46 q-26 -4 -30 -30 q-2 -14 12 -16Z" fill="#5a3418"/>
      <path d="M200 150 q4 36 -18 46 q26 -4 30 -30 q2 -14 -12 -16Z" fill="#5a3418"/>
      <!-- nose -->
      <circle cx="150" cy="166" r="17" fill="#f6a877"/>
      <ellipse cx="144" cy="161" rx="5" ry="4" fill="#ffd9b0" opacity=".8"/>
      <!-- eyes -->
      <g>
        <ellipse class="eye" cx="131" cy="140" rx="9" ry="12" fill="#fff"/>
        <ellipse class="eye" cx="169" cy="140" rx="9" ry="12" fill="#fff"/>
        <circle cx="133" cy="142" r="4.6" fill="#2a2440"/>
        <circle cx="171" cy="142" r="4.6" fill="#2a2440"/>
        <circle cx="134.6" cy="140" r="1.6" fill="#fff"/>
        <circle cx="172.6" cy="140" r="1.6" fill="#fff"/>
      </g>
      <!-- eyebrows -->
      <path d="M120 126 q11 -7 22 -1" stroke="#5a3418" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M158 125 q11 -6 22 1" stroke="#5a3418" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- mustache -->
      <path d="M128 182 q22 16 44 0 q-6 14 -22 14 q-16 0 -22 -14Z" fill="#5a3418"/>
      <path d="M150 182 q-14 10 -28 6" stroke="#48290f" stroke-width="2" fill="none" opacity=".5"/>
      <!-- smile -->
      <path d="M138 198 q12 8 24 0" stroke="#9a4f28" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- cap -->
    <g filter="url(#soft)">
      <path d="M96 118 q54 -58 108 0 q-8 -2 -14 2 q-40 -30 -80 0 q-6 -4 -14 -2Z" fill="url(#capR)"/>
      <path d="M150 74 q46 2 54 46 q-54 -30 -108 0 q8 -44 54 -46Z" fill="url(#capR)"/>
      <!-- brim -->
      <path d="M150 116 q34 -2 58 10 q-6 14 -26 14 q-26 -16 -58 -8 q10 -14 26 -16Z" fill="#b5241f"/>
      <!-- emblem: code brackets on a white badge -->
      <circle cx="150" cy="96" r="16" fill="#fff"/>
      <text x="150" y="102" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#d12f2a">&lt;/&gt;</text>
      <!-- cap gloss -->
      <path d="M150 74 q38 2 50 40 q-40 -20 -80 -8 q6 -30 30 -32Z" fill="url(#gloss)"/>
    </g>
  </g>

  <!-- ===================== GREEN BRO ("Byte") ===================== -->
  <g class="petB">
    <g filter="url(#soft)">
      <path d="M274 302 Q312 318 350 302 L344 230 Q312 218 280 230 Z" fill="url(#deni)"/>
      <path d="M274 302 Q312 318 350 302 L348 288 Q312 302 276 288 Z" fill="#24307a"/>
      <path d="M280 232 Q312 214 344 232 L350 252 Q312 238 274 252 Z" fill="url(#capG)"/>
      <circle cx="270" cy="256" r="16" fill="url(#capG)"/>
      <circle cx="354" cy="256" r="16" fill="url(#capG)"/>
      <circle cx="263" cy="272" r="12" fill="#fdfdfd"/>
      <circle cx="361" cy="272" r="12" fill="#fdfdfd"/>
      <rect x="293" y="230" width="9" height="40" rx="4" fill="url(#deni)"/>
      <rect x="322" y="230" width="9" height="40" rx="4" fill="url(#deni)"/>
      <circle cx="297" cy="242" r="4.4" fill="#ffd34e"/>
      <circle cx="326" cy="242" r="4.4" fill="#ffd34e"/>
      <ellipse cx="295" cy="308" rx="18" ry="11" fill="#6a3b1c"/>
      <ellipse cx="329" cy="308" rx="18" ry="11" fill="#6a3b1c"/>
    </g>

    <g filter="url(#soft)">
      <circle cx="312" cy="146" r="56" fill="url(#skin)"/>
      <circle cx="260" cy="148" r="12" fill="url(#skin)"/>
      <circle cx="364" cy="148" r="12" fill="url(#skin)"/>
      <path d="M264 146 q-4 34 17 44 q-25 -4 -29 -28 q-2 -14 12 -16Z" fill="#3a2a12"/>
      <path d="M360 146 q4 34 -17 44 q25 -4 29 -28 q2 -14 -12 -16Z" fill="#3a2a12"/>
      <circle cx="312" cy="162" r="16" fill="#f6a877"/>
      <ellipse cx="306" cy="157" rx="5" ry="4" fill="#ffd9b0" opacity=".8"/>
      <g>
        <ellipse class="eyeB" cx="294" cy="137" rx="9" ry="12" fill="#fff"/>
        <ellipse class="eyeB" cx="330" cy="137" rx="9" ry="12" fill="#fff"/>
        <circle cx="296" cy="139" r="4.6" fill="#2a2440"/>
        <circle cx="332" cy="139" r="4.6" fill="#2a2440"/>
        <circle cx="297.6" cy="137" r="1.6" fill="#fff"/>
        <circle cx="333.6" cy="137" r="1.6" fill="#fff"/>
      </g>
      <path d="M283 122 q11 -8 22 -2" stroke="#3a2a12" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M320 121 q11 -6 22 2" stroke="#3a2a12" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M290 178 q22 16 44 0 q-6 14 -22 14 q-16 0 -22 -14Z" fill="#3a2a12"/>
      <path d="M300 194 q12 8 24 0" stroke="#9a4f28" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <g filter="url(#soft)">
      <path d="M258 114 q54 -58 108 0 q-8 -2 -14 2 q-40 -30 -80 0 q-6 -4 -14 -2Z" fill="url(#capG)"/>
      <path d="M312 70 q46 2 54 46 q-54 -30 -108 0 q8 -44 54 -46Z" fill="url(#capG)"/>
      <path d="M312 112 q34 -2 58 10 q-6 14 -26 14 q-26 -16 -58 -8 q10 -14 26 -16Z" fill="#157a3b"/>
      <circle cx="312" cy="92" r="16" fill="#fff"/>
      <text x="312" y="98" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="15" font-weight="700" fill="#1f9e52">&lt;/&gt;</text>
      <path d="M312 70 q38 2 50 40 q-40 -20 -80 -8 q6 -30 30 -32Z" fill="url(#gloss)"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#ffe7a1">
    <path class="spark" d="M70 70 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4Z"/>
    <path class="spark" d="M402 120 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3Z" style="animation-delay:.8s"/>
    <path class="spark" d="M388 54 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 l6 -2.5Z" style="animation-delay:1.4s"/>
  </g>
</svg>
