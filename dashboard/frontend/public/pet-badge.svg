<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Two plumber-coder pet faces, red and green">
  <defs>
    <radialGradient id="bbg" cx="50%" cy="42%" r="70%"><stop offset="0%" stop-color="#2a2550"/><stop offset="100%" stop-color="#171331"/></radialGradient>
    <linearGradient id="bk" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffd9b0"/><stop offset="100%" stop-color="#f2b483"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff5a52"/><stop offset="100%" stop-color="#d12f2a"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4fd27a"/><stop offset="100%" stop-color="#1f9e52"/></linearGradient>
    <style>
      @keyframes b1{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes b2{0%,100%{transform:translateY(-2px)}50%{transform:translateY(-7px)}}
      @keyframes bl{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
      .h1{animation:b1 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .h2{animation:b2 2.4s ease-in-out infinite .4s;transform-box:fill-box;transform-origin:center}
      .e{animation:bl 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @media (prefers-reduced-motion:reduce){.h1,.h2,.e{animation:none}}
    </style>
  </defs>

  <rect width="160" height="160" fill="url(#bbg)"/>

  <!-- GREEN (behind, upper-right) -->
  <g class="h2">
    <circle cx="104" cy="66" r="38" fill="url(#bk)"/>
    <circle cx="99" cy="76" r="10" fill="#f6a877"/>
    <ellipse class="e" cx="93" cy="59" rx="6" ry="8.5" fill="#fff"/><ellipse class="e" cx="116" cy="59" rx="6" ry="8.5" fill="#fff"/>
    <circle cx="94" cy="61" r="3.1" fill="#2a2440"/><circle cx="117" cy="61" r="3.1" fill="#2a2440"/>
    <path d="M85 84 q19 12 38 0 q-6 11 -19 11 q-13 0 -19 -11Z" fill="#3a2a12"/>
    <path d="M66 50 q38 -40 76 0 q-6 -2 -10 1 q-28 -21 -56 0 q-4 -3 -10 -1Z" fill="url(#g)"/>
    <path d="M104 20 q32 1 38 32 q-38 -21 -76 0 q6 -31 38 -32Z" fill="url(#g)"/>
    <path d="M104 48 q25 -1 42 8 q-5 10 -19 10 q-18 -11 -42 -5 q8 -11 19 -13Z" fill="#157a3b"/>
    <circle cx="104" cy="33" r="10" fill="#fff"/>
    <text x="104" y="37.5" text-anchor="middle" font-family="Consolas,monospace" font-size="10" font-weight="700" fill="#1f9e52">&lt;/&gt;</text>
  </g>

  <!-- RED (front, lower-left) -->
  <g class="h1">
    <circle cx="60" cy="94" r="42" fill="url(#bk)"/>
    <circle cx="60" cy="106" r="11" fill="#f6a877"/>
    <ellipse class="e" cx="47" cy="87" rx="6.6" ry="9" fill="#fff"/><ellipse class="e" cx="74" cy="87" rx="6.6" ry="9" fill="#fff"/>
    <circle cx="48" cy="89" r="3.4" fill="#2a2440"/><circle cx="75" cy="89" r="3.4" fill="#2a2440"/>
    <circle cx="49.3" cy="87" r="1.1" fill="#fff"/><circle cx="76.3" cy="87" r="1.1" fill="#fff"/>
    <path d="M39 114 q21 13 42 0 q-6 12 -21 12 q-15 0 -21 -12Z" fill="#5a3418"/>
    <path d="M18 72 q42 -44 84 0 q-6 -2 -11 1 q-31 -23 -62 0 q-5 -3 -11 -1Z" fill="url(#r)"/>
    <path d="M60 40 q36 1 42 36 q-42 -23 -84 0 q6 -35 42 -36Z" fill="url(#r)"/>
    <path d="M60 70 q27 -1 46 8 q-5 11 -21 11 q-20 -12 -46 -6 q8 -11 21 -13Z" fill="#b5241f"/>
    <circle cx="60" cy="54" r="11.5" fill="#fff"/>
    <text x="60" y="58.5" text-anchor="middle" font-family="Consolas,monospace" font-size="11" font-weight="700" fill="#d12f2a">&lt;/&gt;</text>
  </g>
</svg>
